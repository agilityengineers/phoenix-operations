<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Poppins', sans-serif; background: #F7F4EE; color: #14263B; }
  a { color: #D96C2C; text-decoration: none; } a:hover { color: #B5541C; }
</style>
</helmet>
<div style="min-width: 900px">
<header style="background: rgba(247,244,238,0.94); border-bottom: 1px solid #E5DFD2">
  <div style="max-width: 1140px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between">
    <a href="Phoenix Site.dc.html" style="display: flex"><img src="assets/logo.png" alt="Phoenix Operations" style="height: 54px; mix-blend-mode: multiply"></a>
    <div style="display: flex; gap: 8px; background: #fff; border: 1px solid #E7E2D6; border-radius: 8px; padding: 4px">
      <button onClick="{{ pickPrivacy }}" style="{{ privacyCss }}">Privacy Policy</button>
      <button onClick="{{ pickTerms }}" style="{{ termsCss }}">Terms of Service</button>
    </div>
  </div>
</header>
<main style="max-width: 820px; margin: 0 auto; padding: 64px 32px 96px">
  <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #D96C2C">{{ kicker }}</p>
  <h1 style="margin: 12px 0 0; font-size: 40px; font-weight: 800">{{ title }}</h1>
  <p style="margin: 12px 0 0; font-size: 14px; color: #8A94A2">Last updated: September 3, 2026 · <strong style="color: #B5541C">Draft — requires attorney review before launch</strong></p>
  <div style="margin-top: 40px; display: flex; flex-direction: column; gap: 32px">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="8">
      <section>
        <h2 style="margin: 0; font-size: 21px; font-weight: 800">{{ s.h }}</h2>
        <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.75; color: #3A4A5E; text-wrap: pretty">{{ s.body }}</p>
      </section>
    </sc-for>
  </div>
  <div style="margin-top: 48px; background: #FFFFFF; border: 1px solid #EDE7DA; border-radius: 12px; padding: 24px 30px">
    <div style="font-size: 15px; font-weight: 700">Questions?</div>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: #4A5A6E">Contact us at <a href="#">privacy@phoenixoperations.com</a> — we respond within 5 business days.</p>
  </div>
</main>
<footer style="background: #14263B">
  <div style="max-width: 1140px; margin: 0 auto; padding: 18px 32px; display: flex; justify-content: space-between; align-items: center">
    <span style="color: #7E8DA1; font-size: 13px">© 2026 Phoenix Operations. All rights reserved.</span>
    <a href="Phoenix Site.dc.html" style="color: #7E8DA1; font-size: 13px" style-hover="color: #fff">← Back to site</a>
  </div>
</footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'privacy' };
  tabCss(active) {
    return `border: none; border-radius: 6px; padding: 9px 16px; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; background: ${active ? '#14263B' : 'none'}; color: ${active ? '#fff' : '#6A7686'};`;
  }
  renderVals() {
    const privacy = this.state.tab === 'privacy';
    return {
      pickPrivacy: () => this.setState({ tab: 'privacy' }),
      pickTerms: () => this.setState({ tab: 'terms' }),
      privacyCss: this.tabCss(privacy), termsCss: this.tabCss(!privacy),
      kicker: privacy ? 'Your data, plainly' : 'The ground rules',
      title: privacy ? 'Privacy Policy' : 'Terms of Service',
      sections: privacy ? [
        { h: '1. What we collect', body: 'Information you provide through our intake forms (name, work email, company, phone, role, and your answers about your business), scheduling details, and information collected automatically: pages visited, referral source, UTM campaign parameters, device and browser type, and IP address.' },
        { h: '2. How we use it', body: 'To prepare for and conduct the conversation you requested, to operate and improve our funnels and website, to send transactional email (confirmations, reminders, internal notifications), and — only with your consent — occasional relevant follow-up. We score intake answers internally to prioritize outreach; scoring never results in automated rejection.' },
        { h: '3. Who we share it with', body: 'Service providers that run our platform: hosting (Vercel/Replit), database (Supabase), email delivery (SendGrid), scheduling, and — where a workspace has enabled them — CRM synchronization (HubSpot) and automation (Zapier) under their respective data processing agreements. We do not sell personal information.' },
        { h: '4. White-label workspaces', body: 'Some pages on this platform are operated by independent partner practices (e.g. EOS implementers or consultants). When you submit a form on a partner\u2019s workspace, that partner is the data controller for your submission and Phoenix Operations acts as the platform processor.' },
        { h: '5. Retention', body: 'Intake submissions and CRM records are kept while there is an active relationship or legitimate business need, and deleted or anonymized on verified request. Partial (unsubmitted) intake progress stored in your browser can be cleared by you at any time.' },
        { h: '6. Your rights', body: 'Depending on your jurisdiction (including GDPR and CCPA/CPRA), you may request access, correction, deletion, portability, or restriction of processing, and opt out of marketing at any time via the unsubscribe link or by contacting us.' },
        { h: '7. Security', body: 'Data is encrypted in transit and at rest, access is role-restricted (admin / owner / staff), and integrations use OAuth or token authentication. No method is 100% secure; we will notify affected users of any breach as required by law.' },
        { h: '8. Cookies & tracking', body: 'We use first-party cookies for session state and form resume, and campaign attribution (UTM) parameters for funnel analytics. We do not use third-party advertising cookies on intake pages.' },
      ] : [
        { h: '1. The service', body: 'Phoenix Operations provides business coaching services and a software platform for funnels, intake, and client management, including white-labeled partner workspaces. These terms govern use of the website, funnels, and platform.' },
        { h: '2. Scheduling & conversations', body: 'The 15-minute conversation is free and carries no obligation. Coaching engagements, if any, are governed by a separate written agreement. Nothing on this site constitutes financial, legal, or accounting advice.' },
        { h: '3. Accounts & roles', body: 'Workspace admins are responsible for the users they invite and the roles they assign (admin, owner, staff, partner). You are responsible for safeguarding credentials and for activity under your account.' },
        { h: '4. Partner workspaces', body: 'Partners operate their own white-labeled workspaces and are solely responsible for their client relationships, content, and compliance with applicable marketing and privacy laws. EOS\u00ae and related marks belong to EOS Worldwide; use of methodology trademarks must follow the mark owner\u2019s guidelines.' },
        { h: '5. Acceptable use', body: 'No unlawful, deceptive, or spam-generating use of funnels or email features; no scraping, reverse engineering, or reselling of the platform outside an authorized partner agreement.' },
        { h: '6. Fees & trials', body: 'Paid plans bill monthly via Stripe after any free trial. You can cancel anytime, effective at the end of the billing period. Fees are non-refundable except where required by law.' },
        { h: '7. Data & content ownership', body: 'You own your workspace content and client records. You grant us a limited license to host and process them to operate the service. We may use aggregated, de-identified usage data to improve the platform.' },
        { h: '8. Disclaimers & liability', body: 'The service is provided "as is." To the maximum extent permitted by law, our total liability is limited to fees paid in the twelve months preceding the claim. Business results depend on execution and are not guaranteed.' },
        { h: '9. Changes & termination', body: 'We may update these terms with 30 days\u2019 notice for material changes. We may suspend accounts for violation of these terms. Governing law and venue to be confirmed with counsel.' },
      ],
    };
  }
}
</script>
</body>
</html>
